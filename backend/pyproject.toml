[project]
name = "simba"
version = "0.1.0"
description = "Simba backend: FastAPI + LangGraph"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "anyio>=4.15.1",
    "fastapi>=0.141.1",
    "huggingface-hub>=1.33.0",
    "langchain-anthropic>=1.7.4",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "onnxruntime>=1.30.0",
    "python-dotenv>=1.2.3",
    "tokenizers>=0.23.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
