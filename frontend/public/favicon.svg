<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Browser-tab icon: Simba's idle face, a copy of SimbaAvatar (mood "idle") without the blink.
       Ink is fixed to #1A1A1A (the `ink` token) because a favicon can't use the page's currentColor.
       If you redraw Simba in src/components/SimbaAvatar.tsx, update this copy too. -->
  <g fill="white" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- ears: two upright points (right mirrors left), solid inner ears -->
    <path d="M12 30 L9 5 L28 18 Z"/>
    <path d="M14.5 21 L13 12 L20.5 17.5 Z" fill="#1A1A1A" stroke="none"/>
    <path d="M52 30 L55 5 L36 18 Z"/>
    <path d="M49.5 21 L51 12 L43.5 17.5 Z" fill="#1A1A1A" stroke="none"/>
    <!-- head -->
    <ellipse cx="32" cy="37" rx="25" ry="21"/>
    <!-- scruffy tuft -->
    <path d="M24 18.5 C25 12 29 10 29.5 15.5 C30 7 36 7 34.5 15.5 C37 10 41.5 12 40 18.5"/>
    <!-- whiskers and nose -->
    <path d="M14 41 L2 38.5 M14 45 L3 48 M50 41 L62 38.5 M50 45 L61 48" fill="none" stroke-width="1.8"/>
    <path d="M29.5 40.5 H34.5 L32 43.5 Z" fill="#1A1A1A" stroke-width="1.5"/>
    <!-- dot eyes -->
    <circle cx="23" cy="35" r="3.3" fill="#1A1A1A" stroke="none"/>
    <circle cx="41" cy="35" r="3.3" fill="#1A1A1A" stroke="none"/>
    <!-- "w" mouth with a tiny fang -->
    <path d="M33.2 46.6 L34.6 49.8 L35.8 46.8" stroke-width="1.4"/>
    <path d="M27 45 Q29.5 48 32 45 Q34.5 48 37 45" fill="none" stroke-width="2.2"/>
  </g>
</svg>
