# CI — runs on every pull request into main and on every push to main.
#
# Two jobs run side by side; a PR may merge when both are green:
#   backend   the Python test suite with the free fake model (no API key, no secrets, $0)
#   frontend  lint, type-check and production build of the web app
# A smoke job (start the real server, send a message over HTTP) joins once the API exists (step 1).

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch cancels the run still going for the older commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SIMBA_FAKE_LLM: "1" # free fake model, never Claude

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv (and cache downloaded Python packages between runs)
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (exactly the versions in uv.lock)
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (exactly the versions in package-lock.json)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check and build
        run: npm run build
