# ---- clarification: too vague to answer well; a short question is the right reply ----
- id: c01
  group: clarification
  turns: ["Book it for me."]
  expected: A short question asking what should be booked, and saying it can't make bookings itself if relevant.
  needs_search: false
- id: c02
  group: clarification
  turns: ["Which one is better?"]
  expected: A short question asking which options are being compared.
  needs_search: false

# ---- conversation: keeps context across turns ----
- id: m01
  group: conversation
  turns:
    - "Hi! I'm Sol and I'm learning to build AI agents."
    - "I mostly work in Python."
    - "What language do I mostly use, and what am I learning?"
  expected: Python; building AI agents.
  needs_search: false
  remember: true
- id: m02
  group: conversation
  turns:
    - "I'm planning a trip to Lisbon in May with my sister."
    - "She's vegetarian."
    - "Suggest one dinner idea for us there."
  expected: A vegetarian-friendly dinner suggestion in Lisbon.
  needs_search: false
  remember: true
- id: m03
  group: conversation
  turns:
    - "Let's call my project 'Tiger'."
    - "Actually, rename it to 'Simba'."
    - "What's my project called?"
  expected: Simba.
  needs_search: false
  remember: true

