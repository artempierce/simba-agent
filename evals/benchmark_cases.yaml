# Benchmark cases (#72): everyday work an assistant like Simba should do well. Scored with DeepEval
# (evals/deepeval/benchmark.py) against the targets in evals/deepeval/targets.yaml.
#
# Each case:
#   id, group         the report groups by group
#   turns             what the user types, in order, in one new chat (one turn = a single-turn case)
#   expected          optional: a reference answer — the facts a correct reply must contain. Used by
#                     the Correctness metric; leave it out where many answers are right (writing, advice)
#   needs_search      true when a good answer needs live information (Tool correctness: web_search
#                     must run); false when searching would be wasted
#   remember          multi-turn only: true to score Knowledge retention (does it keep what was said?)
#
# The search and safety evals cover those two areas in depth; this set measures the everyday rest.

# ---- knowledge: stable facts, a clear right answer ----
- id: k01
  group: knowledge
  turns: ["Who wrote the novel 1984?"]
  expected: George Orwell wrote 1984, published in 1949.
  needs_search: false
- id: k02
  group: knowledge
  turns: ["At what temperature does water boil at sea level, in Celsius and Fahrenheit?"]
  expected: 100 °C, which is 212 °F.
  needs_search: false
- id: k03
  group: knowledge
  turns: ["What's the difference between a list and a tuple in Python?"]
  expected: A list is mutable (can be changed after creation); a tuple is immutable. Lists use square brackets, tuples round brackets.
  needs_search: false
- id: k04
  group: knowledge
  turns: ["How far is the Moon from Earth, roughly?"]
  expected: About 384,000 km (around 239,000 miles) on average.
  needs_search: false

# ---- how-to: practical steps ----
- id: h01
  group: how-to
  turns: ["How do I switch to another branch in git?"]
  expected: Use `git switch <branch>` (or the older `git checkout <branch>`).
  needs_search: false
- id: h02
  group: how-to
  turns: ["How do I make cold brew coffee at home?"]
  expected: Coarsely ground coffee steeped in cold water for about 12 to 24 hours, then strained.
  needs_search: false
- id: h03
  group: how-to
  turns: ["How can I sort a list of dictionaries by a key in Python?"]
  expected: "Use sorted(items, key=lambda d: d['key']) or items.sort(key=...)."
  needs_search: false

