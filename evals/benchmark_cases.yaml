# ---- reasoning: work it out, show the answer ----
- id: r01
  group: reasoning
  turns: ["A train leaves at 14:20 and the trip takes 2 hours 55 minutes. When does it arrive?"]
  expected: 17:15.
  needs_search: false
- id: r02
  group: reasoning
  turns: ["If 3 painters paint 3 walls in 3 hours, how long do 6 painters need for 6 walls?"]
  expected: 3 hours.
  needs_search: false
- id: r03
  group: reasoning
  turns: ["I have 12 apples, give away a third, then eat 2. How many are left?"]
  expected: 6 apples.
  needs_search: false
- id: r04
  group: reasoning
  turns: ["What's 15% of 80?"]
  expected: "12."
  needs_search: false

