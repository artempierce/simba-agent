[project]
name = "simba-deepeval"
version = "0.1.0"
description = "Benchmark evals (DeepEval) and red teaming (DeepTeam) for Simba, run against its HTTP API."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "deepeval>=4.2.7",
    "deepteam>=1.0.9",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sentry-sdk>=2.71.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
